learm_hw_bridge:
  ros__parameters:
    joint_names:  [shoulder_pan, shoulder_lift, elbow1, elbow2, wrist_flex, wrist_roll, grip_left]
    channels:     [0, 1, 2, 3, 4, 5, 6]

    # directions exactly as you had
    invert:          [false, true, false, false, false, false, false]

    # keep your trims (you had only gripper at -5)
    zero_offset_deg: [21,0,0,0,0,0,-5]

    # UI/command space = joint-space degrees around 0 (back to what you were using)
    angle_min_deg: [-120,-120,-120,-120,-120,-120,-30]
    angle_max_deg: [ 120, 120, 120, 120, 120, 120, 30]

    # HARD servo rails (actual motor capability); bridge must NEVER map past these
    # If your driver supports these, great; if not, they�ll just be ignored (harmless).
    servo_min_deg: [0, 0, 0, 0, 0, 0, 0]
    servo_max_deg: [180,180,180,180,180,180,180]
    servo_us_min: 520      # small cushion vs 500 �s
    servo_us_max: 2480     # small cushion vs 2500 �s

    # PCA9685 + motion shaping
    i2c_address: 64
    pwm_freq: 50

    # slow down to avoid thrashing while we test
    rate_hz: 50.0
    slew_deg_per_s: 30.0
    deadband_deg: 3.0
